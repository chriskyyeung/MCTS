[project]
name = "mcts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy==2.5.0",
    "pyyaml==6.0.3",
    "torch>=2.12.1",
    "tqdm==4.68.3",
]

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
    "plotly==6.8.0",
    "ruff>=0.12.0",
    "black>=25.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402"]
fixable = ["ALL"]


[tool.black]
line-length = 120
target-version = ["py313"]
